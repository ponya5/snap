<!doctype html><meta charset="utf-8">
<video id="v" muted></video><canvas id="c"></canvas>
<script>
api.onStart(async o => {
  const ctx = new AudioContext(), dest = ctx.createMediaStreamDestination();
  let hasAudio = false;
  const feed = stream => { ctx.createMediaStreamSource(stream).connect(dest); hasAudio = true; };
  let disp;
  try { disp = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: o.sys }); }
  catch (e) {
    disp = await navigator.mediaDevices.getUserMedia({ audio: false, video: { mandatory: { chromeMediaSource: 'desktop', chromeMediaSourceId: o.id } } });
  }
  if (disp.getAudioTracks().length) feed(new MediaStream(disp.getAudioTracks()));
  let mic;
  if (o.mic) try { mic = await navigator.mediaDevices.getUserMedia({ audio: true }); feed(mic); } catch (e) {}

  const v = document.getElementById('v');
  v.srcObject = new MediaStream(disp.getVideoTracks()); await v.play();
  const k = v.videoWidth / o.dw, r = o.region;
  const sx = r.x * k, sy = r.y * k, sw = r.w * k, sh = r.h * k;
  const cv = document.getElementById('c');
  cv.width = Math.round(sw / 2) * 2; cv.height = Math.round(sh / 2) * 2;
  const g = cv.getContext('2d');
  const tick = setInterval(() => g.drawImage(v, sx, sy, sw, sh, 0, 0, cv.width, cv.height), 33);

  const out = cv.captureStream(30);
  if (hasAudio) dest.stream.getAudioTracks().forEach(t => out.addTrack(t));
  const mp4 = o.format !== 'webm' && MediaRecorder.isTypeSupported('video/mp4;codecs=avc1,mp4a.40.2');
  const rec = new MediaRecorder(out, { mimeType: mp4 ? 'video/mp4;codecs=avc1,mp4a.40.2' : 'video/webm', videoBitsPerSecond: 8e6 });
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = async () => {
    clearInterval(tick);
    [disp, mic].forEach(s => s && s.getTracks().forEach(t => t.stop()));
    api.videoDone(await new Blob(chunks).arrayBuffer(), mp4 ? 'mp4' : 'webm');
  };
  api.onStop(() => rec.stop());
  rec.start(1000);
});
</script>
