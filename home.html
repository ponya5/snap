<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 20px; font: 14px system-ui; background: #1e1e1e; color: #eee; text-align: center; }
  h2 { margin: 0 0 16px; }
  button { display: block; width: 100%; padding: 14px; font-size: 16px; border: 0; border-radius: 8px; background: #2d7ff9; color: #fff; cursor: pointer; }
  p { color: #999; font-size: 12px; line-height: 1.6; margin-top: 16px; }
</style>
<h2>Snap</h2>
<button onclick="api.cmd('shot')">📷 Screenshot</button>
<button onclick="api.cmd('video')" style="margin-top:8px;background:#d93a3a">🎥 Record video</button>
<button onclick="api.cmd('settings')" style="margin-top:8px;background:#444">Settings</button>
<p>Choose screenshot or video, then drag to select an area.<br>Shortcuts can be changed in Settings.<br>Closing this window keeps Snap running in the tray.</p>
<script>window.addEventListener('load', () => api.fit(document.body.getBoundingClientRect().height));</script>
