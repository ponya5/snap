<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 20px; font: 14px system-ui; background: #1e1e1e; color: #eee; }
  h2 { margin: 0 0 16px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0; }
  input[type=text], select, input[type=number] { background: #333; color: #fff; border: 1px solid #555; border-radius: 5px; padding: 6px 8px; font-size: 14px; }
  #hotkey { width: 180px; text-align: center; cursor: pointer; }
  #hotkey.rec { border-color: #2d7ff9; }
  #folder { width: 190px; }
  button { background: #2d7ff9; color: #fff; border: 0; border-radius: 5px; padding: 7px 12px; cursor: pointer; }
  button.g { background: #444; }
  #msg { height: 18px; color: #f77; font-size: 12px; }
  small { color: #999; }
</style>
<h2>Snap Settings</h2>
<div class="row"><span>Capture shortcut</span><input id="hotkey" type="text" readonly></div>
<div class="row"><span>Save folder<br><small>empty = Pictures / Movies</small></span>
  <span><input id="folder" type="text" readonly placeholder="Default"> <button class="g" id="pick">Browse</button></span></div>
<div class="row"><span>Ask where to save each time</span><input id="ask" type="checkbox"></div>
<div class="row"><span>Screenshot format</span><select id="format"><option value="png">PNG</option><option value="jpg">JPG</option></select></div>
<div class="row"><span>Video countdown (seconds, 0 = none)</span><input id="countdown" type="number" min="0" max="10" style="width:60px"></div>
<div class="row"><span>Record system sound by default</span><input id="sys" type="checkbox"></div>
<div class="row"><span>Record microphone by default</span><input id="mic" type="checkbox"></div>
<div class="row"><span id="msg"></span><button id="save">Save</button></div>
<script>
const $ = id => document.getElementById(id);
const mac = navigator.platform.includes('Mac');
let hotkey = '';
const show = a => a.replace('CommandOrControl', mac ? '⌘' : 'Ctrl').replace(/\+/g, ' + ');
const KEYS = { ' ': 'Space', ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right' };

api.settings.get().then(s => {
  hotkey = s.hotkey; $('hotkey').value = show(hotkey);
  $('folder').value = s.folder; $('ask').checked = s.askWhere; $('format').value = s.format;
  $('countdown').value = s.countdown; $('sys').checked = s.sys; $('mic').checked = s.mic;
});

$('hotkey').onfocus = () => { $('hotkey').classList.add('rec'); $('hotkey').value = 'Press new shortcut…'; };
$('hotkey').onblur = () => { $('hotkey').classList.remove('rec'); $('hotkey').value = show(hotkey); };
$('hotkey').onkeydown = e => {
  e.preventDefault();
  if (['Meta', 'Control', 'Alt', 'Shift'].includes(e.key)) return;
  if (!(e.metaKey || e.ctrlKey || e.altKey)) { $('msg').textContent = 'Use at least Ctrl/Cmd or Alt.'; return; }
  const k = KEYS[e.key] || (e.key.length === 1 ? e.key.toUpperCase() : e.key);
  hotkey = [(e.metaKey || e.ctrlKey) && 'CommandOrControl', e.altKey && 'Alt', e.shiftKey && 'Shift', k].filter(Boolean).join('+');
  $('msg').textContent = ''; $('hotkey').blur();
};
$('pick').onclick = async () => { const f = await api.settings.pick(); if (f) $('folder').value = f; };
$('save').onclick = async () => {
  const r = await api.settings.set({
    hotkey, folder: $('folder').value, askWhere: $('ask').checked, format: $('format').value,
    countdown: Math.max(0, Math.min(10, +$('countdown').value || 0)), sys: $('sys').checked, mic: $('mic').checked,
  });
  if (r.error) { $('msg').textContent = r.error; api.settings.get().then(s => { hotkey = s.hotkey; $('hotkey').value = show(hotkey); }); }
  else { $('msg').style.color = '#7c7'; $('msg').textContent = 'Saved'; setTimeout(() => { $('msg').textContent = ''; $('msg').style.color = '#f77'; }, 1500); }
};
</script>
