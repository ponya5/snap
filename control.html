<!doctype html><meta charset="utf-8">
<style>
  body { margin: 0; display: flex; align-items: center; gap: 10px; padding: 0 10px; height: 100vh; background: #222; color: #fff; font: 14px system-ui; -webkit-app-region: drag; }
  i { width: 10px; height: 10px; border-radius: 50%; background: #f33; animation: b 1s infinite; }
  @keyframes b { 50% { opacity: .2; } }
  button { margin-left: auto; background: #d93a3a; color: #fff; border: 0; border-radius: 5px; padding: 6px 12px; cursor: pointer; -webkit-app-region: no-drag; }
</style>
<i></i><span id="t">0:00</span><button onclick="api.cmd('stop')">■ Stop</button>
<script>
const t0 = Date.now();
setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); document.getElementById('t').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }, 500);
</script>
