name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  # Create the release once; otherwise each matrix job creates its own duplicate.
  create:
    runs-on: ubuntu-latest
    steps:
      - run: gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qxF "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --title "${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
  build:
    needs: create
    strategy:
      matrix:
        include:
          - os: macos-latest
            cmd: npx electron-builder --mac dmg zip --publish always
          - os: windows-latest
            cmd: npx electron-builder --win --publish always
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
